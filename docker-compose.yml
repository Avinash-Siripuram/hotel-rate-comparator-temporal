version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporalpassword
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporalpassword
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-rate-comparator-app
    ports:
      - "3000:3000"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - BACKEND_URL=http://next-app:3000
    depends_on:
      temporal:
        condition: service_healthy

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hotel-rate-comparator-worker
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - BACKEND_URL=http://next-app:3000
    depends_on:
      temporal:
        condition: service_healthy
      next-app:
        condition: service_started

volumes:
  postgres_data:
